<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>PisteMates</title>
<meta name="theme-color" content="#0f2a44">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PisteMates">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<style>
/* Layout: full-bleed map, signage-style top bar, bottom sheet with the crew list */
:root{
  --ink:#0f2a44; --ink-2:#3b5670; --snow:#f4f8fb; --card:#ffffff; --line:#d7e2ec;
  --accent:#ff6b00; --ok:#16a34a; --warn:#d97706; --bad:#dc2626; --muted:#7b8fa3;
  --easy:#1d6fe0; --inter:#d42a2a; --adv:#111111; --free:#e08a00;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --shadow:0 6px 24px rgba(15,42,68,.18);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root{
  --ink:#e8f0f7; --ink-2:#a9bccd; --snow:#0c1824; --card:#13253a; --line:#24405c; --muted:#7f97ad;
  --adv:#e8e8e8; --shadow:0 6px 24px rgba(0,0,0,.5); color-scheme:dark }}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:15px/1.4 var(--body);color:var(--ink);background:var(--snow);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
#map{position:fixed;inset:0;background:#dfe8ee}
.leaflet-control-attribution{font-size:9px;opacity:.85;max-width:calc(100vw - 70px);white-space:normal;text-align:right;margin-bottom:calc(var(--sheet-h,140px) + var(--sab)) !important}

.topbar{position:fixed;left:0;right:0;top:0;z-index:1000;display:flex;align-items:center;gap:8px;
  padding:calc(var(--sat) + 8px) max(12px,env(safe-area-inset-right)) 8px max(12px,env(safe-area-inset-left));
  background:linear-gradient(var(--snow) 55%,transparent);pointer-events:none}
.topbar>*{pointer-events:auto}
.brand{font:700 22px/1 var(--display);letter-spacing:.02em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.brand i{display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--accent);transform:rotate(45deg)}
.spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:17px;border:1px solid var(--line);
  background:var(--card);box-shadow:var(--shadow);font-weight:600;font-size:13px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--ok)} .dot.half{background:var(--warn)} .dot.off{background:var(--bad)}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow);
  display:grid;place-items:center}
.iconbtn svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.iconbtn.active{background:var(--ink)} .iconbtn.active svg{stroke:var(--snow)}

.fabs{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:calc(var(--sheet-h,140px) + var(--sab) + 14px);z-index:1000;display:flex;flex-direction:column;gap:10px;transition:bottom .25s}

.banner{position:fixed;left:max(12px,env(safe-area-inset-left));top:calc(var(--sat) + 58px);z-index:1001;max-width:calc(100% - 150px);
  background:var(--ink);color:var(--snow);padding:8px 14px;border-radius:10px;font-size:13px;font-weight:500;box-shadow:var(--shadow);text-align:center}
.banner button{background:none;border:0;color:var(--accent);font-weight:700;padding:0 0 0 8px}

/* bottom sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:1002;background:var(--card);border-radius:18px 18px 0 0;box-shadow:0 -6px 30px rgba(15,42,68,.22);
  padding:0 max(14px,env(safe-area-inset-right)) calc(var(--sab) + 10px) max(14px,env(safe-area-inset-left));max-height:62vh;display:flex;flex-direction:column}
.handle{display:flex;justify-content:center;padding:10px 0 8px;border:0;background:none;width:100%;touch-action:none;cursor:ns-resize}
.handle span{width:48px;height:5px;border-radius:3px;background:var(--line)}
#sheetBody{display:flex;flex-direction:column;min-height:0;flex:1}
.sheet.sized{max-height:none}
.sheet.sized .list{max-height:none;flex:1}
.sheet h2{font:700 15px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin:4px 0 8px;display:flex;align-items:center;gap:8px}
.sheet h2 .count{background:var(--snow);border:1px solid var(--line);border-radius:10px;padding:2px 8px;font-size:12px;color:var(--ink)}
.list{overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:2px;min-height:0}
.sheet:not(.open) .list{max-height:152px}
.row{display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:center;padding:8px 6px;border-radius:12px;border:0;background:none;text-align:left;width:100%}
.row:hover,.row.sel{background:var(--snow)}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 16px/1 var(--display);border:3px solid var(--card);box-shadow:0 0 0 2px currentColor}
.row .nm{font-weight:600;display:flex;gap:6px;align-items:center;min-width:0}
.row .nm b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .st{font-size:13px;color:var(--ink-2);min-width:0;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.row .rt{text-align:right;font-variant-numeric:tabular-nums}
.row .rt .d{font:700 18px/1 var(--display)}
.row .rt .ago{font-size:11px;color:var(--muted)}
.arrow{display:inline-block;width:14px;height:14px;vertical-align:-2px}
.tag{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:5px;background:var(--snow);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.tag.wait{background:#fff3e0;border-color:#ffcc80;color:#9a4b00}
.tag.stale{color:var(--muted)}
.empty{padding:14px 6px;color:var(--ink-2);font-size:14px}
.empty b{color:var(--ink)}

/* detail */
.detail{display:flex;flex-direction:column;gap:10px;overflow-y:auto;min-height:0;padding-bottom:4px}
.dhead{display:flex;align-items:center;gap:10px}
.dhead .t{flex:1;min-width:0}
.dhead .t b{font:700 22px/1.05 var(--display);display:block}
.dhead .t span{font-size:13px;color:var(--ink-2)}
.close{border:1px solid var(--line);background:var(--snow);border-radius:10px;width:36px;height:36px;font-size:18px}
.box{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--snow)}
.box h3{margin:0 0 6px;font:700 13px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.big{font:700 20px/1.15 var(--display)}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.steps{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.steps li{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-size:14px}
.steps .meta{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.pb{display:inline-flex;align-items:center;justify-content:center;min-width:46px;height:22px;padding:0 6px;border-radius:6px;color:#fff;font:700 12px/1 var(--display);letter-spacing:.04em}
.pb.easy{background:var(--easy)} .pb.inter{background:var(--inter)} .pb.adv{background:#111;color:#fff} .pb.free{background:var(--free)}
.pb.lift{background:#7b2fbe} .pb.walk{background:transparent;color:var(--ink-2);border:1px dashed var(--muted)} .pb.conn{background:#7b8fa3}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{height:42px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--snow)}
.small{font-size:12px;color:var(--muted)}

/* status picker */
.statusbar{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.statusbar button{flex:none;height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--line);background:var(--snow);font-size:13px;font-weight:600}
.statusbar button.on{background:var(--ink);color:var(--snow);border-color:var(--ink)}

/* modal */
.modal{position:fixed;inset:0;z-index:2000;background:rgba(10,25,40,.55);display:flex;align-items:flex-end;justify-content:center}
.modal[hidden]{display:none}
.panel{background:var(--card);width:100%;max-width:520px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;
  padding:20px max(18px,env(safe-area-inset-right)) calc(var(--sab) + 18px) max(18px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:14px}
@media (min-width:600px){.modal{align-items:center}.panel{border-radius:20px}}
/* iPhone app: keep forms at the top so the keyboard never covers them */
.native .modal{align-items:flex-start}
.native .panel{border-radius:0 0 20px 20px;padding-top:calc(var(--sat) + 18px);max-height:100%}
.panel h1{font:700 30px/1 var(--display);text-transform:uppercase;margin:0;letter-spacing:.01em}
.panel p{margin:0;color:var(--ink-2)}
label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:13px}
input[type=text]{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--snow);padding:0 12px;font:500 16px var(--body);color:var(--ink)}
input:focus,button:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 60%,transparent);outline-offset:1px}
.colors{display:flex;gap:8px;flex-wrap:wrap}
.colors button{width:36px;height:36px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1px var(--line)}
.colors button.on{box-shadow:0 0 0 3px var(--ink)}
.rowflex{display:flex;gap:8px}
.rowflex input{flex:1;min-width:0}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:500;font-size:14px;flex-direction:row}
.toggle input{width:22px;height:22px;accent-color:var(--accent)}
.hr{height:1px;background:var(--line)}
.names{display:flex;flex-direction:column;gap:10px}
.opt{font-weight:500;color:var(--muted)}
.note{font-size:12px;color:var(--muted);line-height:1.45}

/* map markers */
.fm{position:relative;width:38px;height:38px}
.fm .c{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 15px/1 'Barlow Condensed',sans-serif;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.fm .lbl{position:absolute;left:50%;top:40px;transform:translateX(-50%);background:rgba(15,42,68,.88);color:#fff;font:600 11px/1 Barlow,sans-serif;padding:3px 6px;border-radius:6px;white-space:nowrap}
.fm.stale .c{filter:grayscale(.8);opacity:.6}
.fm.sel .c{box-shadow:0 0 0 4px #ff6b00,0 2px 8px rgba(0,0,0,.4)}
.fm .hd{position:absolute;left:50%;top:50%;width:0;height:0}
.fm .hd::before{content:"";position:absolute;left:-7px;top:-33px;border:7px solid transparent;border-bottom:11px solid #fff;filter:drop-shadow(0 0 1px rgba(0,0,0,.6))}
.fm .pulse{position:absolute;inset:-6px;border-radius:50%;border:2px solid currentColor;animation:pl 2s infinite}
@keyframes pl{from{transform:scale(.8);opacity:.9}to{transform:scale(1.5);opacity:0}}
.me{width:22px;height:22px;border-radius:50%;background:#1a73e8;border:3px solid #fff;box-shadow:0 0 0 2px rgba(26,115,232,.35),0 2px 6px rgba(0,0,0,.4)}
.meet{width:30px;height:30px;border-radius:8px;background:#ff6b00;border:3px solid #fff;transform:rotate(45deg);box-shadow:0 2px 8px rgba(0,0,0,.4)}
.toast{position:fixed;left:50%;bottom:calc(var(--sheet-h,140px) + var(--sab) + 20px);transform:translateX(-50%);z-index:3000;background:var(--ink);color:var(--snow);padding:10px 16px;border-radius:12px;font-weight:600;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.leaflet-popup-content{font:14px/1.35 var(--body);margin:10px 12px}

/* tabs + me line */
.tabs{display:flex;gap:6px;margin:2px 0 8px}
.tabs button{flex:1;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--snow);font:700 15px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);display:flex;align-items:center;justify-content:center;gap:6px}
.tabs button.on{background:var(--ink);color:var(--snow);border-color:var(--ink)}
.tabs .count{background:var(--card);color:var(--ink);border-radius:9px;padding:1px 7px;font-size:12px}
.sheet h2.me-line{font:600 13px/1.3 var(--body);letter-spacing:0;text-transform:none;color:var(--ink-2);margin:0 0 6px}
/* cards in the list */
.card{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--snow);display:flex;flex-direction:column;gap:6px;margin-bottom:6px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.card-h b{font:700 16px/1.1 var(--display);letter-spacing:.03em;text-transform:uppercase}
.card .close{width:30px;height:30px;font-size:16px}
.card p{margin:0;font-size:14px}
.card.nav{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.card.meet{border-color:#7c3aed55}
.card.sos{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--card))}
.card.sos .card-h b{color:var(--bad)}
.num{font-size:18px;user-select:all}
.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.nums b{display:block;font:700 22px/1 var(--display);font-variant-numeric:tabular-nums}
.nums span{font-size:11px;color:var(--ink-2)}
.btn.sm{height:34px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.danger{color:var(--bad)}
.btn.sosbtn{background:var(--bad);border-color:var(--bad);color:#fff;font-weight:700}
.actbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:2px 0 8px}
.actbar .hint{flex:1;min-width:140px;text-align:right}
.whos{display:flex;flex-wrap:wrap;gap:6px}
.who{font-size:12px;padding:3px 8px;border-radius:10px;border:1px solid var(--line);background:var(--card)}
.who.yes{border-color:var(--c);box-shadow:inset 3px 0 0 var(--c)}
.who.no{opacity:.6;text-decoration:line-through}
.msgs{gap:4px}
.qmrow{font-size:13px}
.dotc{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:0}
/* ranking */
.leads{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:6px;margin-bottom:8px}
.lead{border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--snow)}
.lead span{display:block;font-size:11px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em}
.lead b{font:700 18px/1.1 var(--display)}
.tablewrap{overflow-x:auto}
table.rank{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.rank th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);padding:6px 4px;border-bottom:1px solid var(--line)}
.rank td{padding:8px 4px;border-bottom:1px solid var(--line);white-space:nowrap}
.rank tr.me td{font-weight:700}
/* map pieces */
.poi{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;color:#fff;font:700 12px/1 'Barlow Condensed',sans-serif;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);background:#8a5a2b}
.lblwrap{background:none;border:0}
.lbl{transform:translate(-50%,-50%);white-space:nowrap;pointer-events:none;font:700 12px/1 'Barlow Condensed',sans-serif;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.lbl.pref{min-width:20px;height:20px;padding:0 4px;border-radius:10px;display:grid;place-items:center;color:#fff;border:2px solid #fff;font-size:12.5px}
.lbl.pref.nov{background:#16a34a}.lbl.pref.easy{background:#1d6fe0}.lbl.pref.inter{background:#d42a2a}.lbl.pref.adv{background:#111}.lbl.pref.free{background:#e08a00}
.lbl.pref.nm{border-radius:6px;font-size:11px;max-width:120px;overflow:hidden;text-overflow:ellipsis}
.lbl.lift{background:#7b2fbe;color:#fff;border-radius:5px;padding:3px 5px;font-size:10.5px;letter-spacing:.04em;border:1px solid #fff}
.lbl.lift b{font-weight:700}
.poi.bar{background:#b4236b}.poi.cafe{background:#6b4f3a}.poi.food{background:#c2410c}
.flag{position:relative;width:12px;height:40px}
.flag::before{content:"";position:absolute;left:0;top:0;width:3px;height:40px;background:#22313f;border-radius:2px}
.flag span{position:absolute;left:3px;top:0;background:#7c3aed;color:#fff;font:700 12px/1 'Barlow Condensed',sans-serif;padding:4px 6px;border-radius:0 6px 6px 0;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.ekpop .leaflet-popup-content{min-width:190px}
.ekpop .btn:not(.primary){background:#fff;color:#0f2a44;border-color:#d7e2ec}
.popact{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.picks{display:flex;flex-direction:column;gap:4px}
.pick{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 10px;width:100%}
.pick:hover{border-color:var(--accent)}
.av.sm{width:32px;height:32px;font-size:13px;border-width:2px}
.pn{min-width:0;display:flex;flex-direction:column}
.pn span{font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pd{font:700 16px/1 var(--display);font-variant-numeric:tabular-nums}
/* right column under the settings button: SOS, chat, guide, my status */
.rcol{position:fixed;top:calc(var(--sat) + 58px);right:max(12px,env(safe-area-inset-right));z-index:1001;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.rbtn{position:relative;height:38px;padding:0 11px;border-radius:12px;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow);display:inline-flex;align-items:center;gap:6px;font:700 14px/1 var(--display);letter-spacing:.04em;text-transform:uppercase;color:var(--ink)}
.rbtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linejoin:round}
.rbtn .badge{position:absolute;top:-6px;right:-6px;margin:0}
#btnNav{background:var(--accent);border-color:var(--accent);color:#fff}
.rbtn.st{text-transform:none;letter-spacing:0;font:600 13px/1 var(--body)}
.rbtn.st small{font-size:10px;opacity:.7}
.rbtn.st.wait{background:#fff3e0;border-color:#ffcc80;color:#9a4b00}
.rbtn.st.hut{background:#f3e8d8;border-color:#d8b98f;color:#6b4423}
.rbtn.st.done{color:var(--ink-2)}
.stmenu[hidden]{display:none}
.stmenu{display:flex;flex-direction:column;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:var(--shadow)}
.stmenu button{height:36px;padding:0 14px;border-radius:9px;border:0;background:none;text-align:right;font-weight:600;font-size:14px;color:var(--ink)}
.stmenu button.on{background:var(--ink);color:var(--snow)}
.sosfab{width:40px;height:40px;border-radius:12px;border:2px solid #fff;background:var(--bad);color:#fff;font:700 14px/1 var(--display);letter-spacing:.04em;box-shadow:var(--shadow)}
.sosfab.on{animation:sosb 1s infinite}
@keyframes sosb{50%{background:#7f1d1d}}
/* my status pill */
.sheet h2.me-line{display:flex;align-items:center;gap:8px}
.sheet h2.me-line>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stpill{flex:none;height:28px;padding:0 10px;border-radius:14px;border:1px solid var(--line);background:var(--card);font:600 13px/1 var(--body);color:var(--ink);display:inline-flex;align-items:center;gap:4px}
.stpill.wait{background:#fff3e0;border-color:#ffcc80;color:#9a4b00}
.stpill.hut{background:#f3e8d8;border-color:#d8b98f;color:#6b4423}
.stpill.done{background:var(--snow);color:var(--ink-2)}
.stpill span{font-size:10px;opacity:.7}
/* action bar: chat left, guide right */
.actbar{flex-wrap:nowrap}
.actbar .grow{flex:1}
.badge[hidden]{display:none}
.badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;margin-left:6px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:700}
.list>*{flex-shrink:0}
.chatlast{cursor:pointer;font-size:13px;color:var(--ink-2);margin:-2px 0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* chat */
.chatpanel{display:flex;flex-direction:column;height:min(640px,calc(100dvh - var(--sat) - 40px));max-height:none}
.chatlist{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:4px 2px}
.msg{max-width:80%;align-self:flex-start;background:var(--snow);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:6px 10px}
.msg.mine{align-self:flex-end;background:var(--accent);color:#fff;border-color:var(--accent);border-radius:14px 14px 4px 14px}
.msg .who{border:0;padding:0;background:none;font-size:12px;font-weight:700;color:var(--c)}
.msg .tm{font-size:10px;opacity:.6;margin-left:6px}
.msg p{margin:0;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}
.chatday{align-self:center;font-size:11px;color:var(--muted)}
.chatform{display:flex;gap:8px;margin-top:6px}
.chatform input{flex:1;min-width:0}
.quick{margin:4px 0 0;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.quick .btn{flex:none}
/* group */
.mrow{display:grid;grid-template-columns:32px 1fr auto;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.mrow .role{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
.mrow .acts{display:flex;gap:4px}
/* my day */
.daynav{display:flex;align-items:center;gap:8px}
.daynav .t{flex:1;min-width:0}
.prof{width:100%;height:84px;display:block}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl li{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;padding:7px 4px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:8px}
.tl li.on{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.tl .tm{font:700 14px/1 var(--display);font-variant-numeric:tabular-nums;color:var(--ink-2)}
.tl .nm b{display:block;font-size:14px}
.tl .nm span{font-size:12px;color:var(--ink-2)}
.tl .mx{font:700 15px/1 var(--display);text-align:right;font-variant-numeric:tabular-nums}
.tl li.lift .nm b{color:#7b2fbe}
.tl li.rest{cursor:default;opacity:.75}
.runno{width:22px;height:22px;border-radius:50%;background:var(--c,#ff6b00);color:#fff;font:700 12px/22px var(--display);text-align:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.daylist{display:flex;flex-direction:column;gap:6px}
.dayrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;text-align:left;width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 12px}
.dayrow b{font:700 17px/1.1 var(--display)}
.dayrow span{font-size:12px;color:var(--ink-2)}
.dayrow .mx{font:700 16px/1 var(--display);text-align:right}
/* destination picker */
.seg{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{flex:1;height:32px;border:0;border-radius:8px;background:none;font-weight:600;font-size:13px;color:var(--ink-2)}
.seg button.on{background:var(--ink);color:var(--snow)}
.seg.small4 button{font-size:12px;padding:0 2px}
.pickcard input[type=search]{height:38px}
.pickcard .picks{max-height:300px;overflow-y:auto}
.picon{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:#fff;font:700 14px/1 var(--display);background:#8a5a2b}
.picon.lift,.picon.top{background:#7b2fbe}
#btnNav.stop{background:var(--ink);border-color:var(--ink);color:var(--snow)}
.card.gather{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
/* language picker, terms, chat message actions */
.langsel{height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 14px var(--body);padding:0 8px;max-width:150px}
.langsel.wide{max-width:none;width:100%;height:42px;margin-top:4px}
.toggle.terms{justify-content:flex-start;gap:10px;font-size:13px;line-height:1.35}
.toggle.terms input{flex:none}
.toggle.terms a{color:var(--accent)}
.note a{color:var(--accent)}
.msg{position:relative}
.msgmore{position:absolute;top:2px;right:4px;border:0;background:none;color:inherit;opacity:.55;font-size:16px;line-height:1;padding:2px 4px}
.msg:not(.mine){padding-right:26px}
.msgacts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
/* resorts */
.resort{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.resort.on b{color:var(--accent)}
.resort .acts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
@media (prefers-reduced-motion:reduce){.fm .pulse{animation:none;display:none}}
</style>
</head>
<body>
<div id="map"></div>

<header class="topbar">
  <div class="brand"><i></i><span data-i="brand">PisteMates</span></div>
  <div class="spacer"></div>
  <button class="chip" id="connChip" data-i-aria="h.conn"><span class="dot" id="connDot"></span><span id="connTxt">…</span></button>
  <button class="iconbtn" id="btnSettings" data-i-aria="h.settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</header>

<div class="rcol" id="rcol">
  <button class="sosfab" id="btnSos" data-i-aria="h.sos">SOS</button>
  <button class="rbtn" id="btnChat" data-i-aria="h.chatAria"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg><span data-i="h.chat">Czat</span><span class="badge" id="chatBadge" hidden></span></button>
  <button class="rbtn" id="btnNav" data-i-aria="rb.navAria"><svg viewBox="0 0 24 24"><path d="M3 11l18-8-8 18-2-8z"/></svg>…</button>
  <button class="rbtn st" id="btnStatus" aria-haspopup="true" aria-expanded="false"><span id="stLabel"></span> <small aria-hidden="true">▾</small></button>
  <div class="stmenu" id="stMenu" role="menu" hidden></div>
</div>

<div class="banner" id="banner" hidden></div>

<div class="fabs">
  <button class="iconbtn" id="btnFit" data-i-aria="h.fit"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  <button class="iconbtn" id="btnMe" data-i-aria="h.me"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
</div>

<section class="sheet" id="sheet">
  <button class="handle" id="handle" data-i-aria="h.handle"><span></span></button>
  <div id="sheetBody"></div>
</section>

<div class="modal" id="setup" hidden>
  <form class="panel" id="setupForm">
    <div class="dhead"><h1 class="t" data-i="su.title" style="margin:0">PisteMates</h1><select id="inLang" class="langsel" data-i-aria="su.lang"></select></div>
    <p data-i="su.lead"></p>
    <div class="names">
      <label for="inNick"><span data-i="su.nick"></span><input type="text" id="inNick" maxlength="20" autocomplete="nickname" data-i-ph="su.nickPh"></label>
      <label for="inFirst"><span data-i="su.first"></span><input type="text" id="inFirst" maxlength="20" autocomplete="given-name" data-i-ph="su.firstPh"></label>
      <label for="inLast"><span><span data-i="su.last"></span> <span class="opt" data-i="su.opt"></span></span><input type="text" id="inLast" maxlength="30" autocomplete="family-name"></label>
      <p class="note" data-i="su.nameNote"></p>
    </div>
    <div><div style="font-weight:600;font-size:13px;margin-bottom:6px" data-i="su.color"></div><div class="colors" id="inColors"></div></div>
    <label for="inGroup"><span data-i="su.group"></span>
      <div class="rowflex"><input type="text" id="inGroup" maxlength="40" autocapitalize="none" autocomplete="off" spellcheck="false" required>
      <button type="button" class="btn" id="btnGen" data-i="su.gen"></button></div>
    </label>
    <p class="note" data-i="su.groupNote"></p>
    <label class="toggle terms"><input type="checkbox" id="inTerms"><span data-i-html="su.terms"></span></label>
    <button class="btn primary" type="submit" data-i="su.join"></button>
  </form>
</div>

<div class="modal" id="settings" hidden>
  <div class="panel">
    <div class="dhead"><div class="t"><b style="font:700 26px/1 var(--display);text-transform:uppercase" data-i="se.title"></b></div><button class="close" data-close data-i-aria="a.close">×</button></div>
    <label for="stLang"><span data-i="su.lang"></span><select id="stLang" class="langsel wide"></select></label>
    <div class="names">
      <label for="stNick"><span data-i="su.nick"></span><input type="text" id="stNick" maxlength="20" autocomplete="nickname"></label>
      <label for="stFirst"><span data-i="su.first"></span><input type="text" id="stFirst" maxlength="20" autocomplete="given-name"></label>
      <label for="stLast"><span><span data-i="su.last"></span> <span class="opt" data-i="su.opt"></span></span><input type="text" id="stLast" maxlength="30" autocomplete="family-name"></label>
    </div>
    <div><div style="font-weight:600;font-size:13px;margin-bottom:6px" data-i="se.color"></div><div class="colors" id="stColors"></div></div>
    <div class="box"><h3 data-i="se.code"></h3><div class="rowflex" style="align-items:center"><code id="stGroup" style="flex:1;font-size:16px;font-weight:600;user-select:all;word-break:break-all"></code><button class="btn" id="btnCopy" data-i="inv.btn"></button></div>
      <p class="note" style="margin-top:6px" data-i="se.shareNote"></p>
      <div class="actions" style="margin-top:8px"><button class="btn" id="btnGroup" data-i="se.members"></button></div></div>
    <div class="hr"></div>
    <div class="box"><h3 data-i="se.batt"></h3><p class="small" id="stBatt">–</p></div>
    <label class="toggle" for="stEco"><span data-i="se.eco"></span><input type="checkbox" id="stEco"></label>
    <label class="toggle" for="stWake"><span data-i="se.wake"></span><input type="checkbox" id="stWake"></label>
    <div class="box"><h3 data-i="se.hide"></h3><div class="opts"><button class="btn sm" data-hide="30">30 min</button><button class="btn sm" data-hide="60">1 h</button><button class="btn sm" data-hide="120">2 h</button></div><p class="note" style="margin-top:6px" data-i="se.hideNote"></p></div>
    <label class="toggle" for="stShare"><span data-i="se.share"></span><input type="checkbox" id="stShare"></label>
    <label class="toggle" for="stDemo"><span data-i="se.demo"></span><input type="checkbox" id="stDemo"></label>
    <div class="hr"></div>
    <div class="box"><h3 data-i="rs.title"></h3><div id="stResorts"></div><p class="small" id="stNet" style="margin-top:6px">–</p></div>
    <div class="actions"><button class="btn primary" id="btnSave" data-i="se.save"></button><button class="btn" id="btnLeave" style="color:var(--bad)" data-i="leave"></button></div>
    <details class="box"><summary style="font-weight:600;cursor:pointer" data-i="se.lic"></summary><p class="note" style="margin-top:6px" data-i-html="se.licData"></p></details>
    <p class="note" data-i-html="se.links"></p>
    <p class="note" data-i="se.note"></p>
  </div>
</div>

<div class="modal" id="meet" hidden>
  <form class="panel" id="meetForm">
    <div class="dhead"><div class="t"><b style="font:700 26px/1 var(--display);text-transform:uppercase" id="mfTitle"></b><span id="mfSub"></span></div><button type="button" class="close" data-close data-i-aria="a.close">×</button></div>
    <label for="mfPlace"><span data-i="mf.place"></span><input type="text" id="mfPlace" maxlength="60" data-i-ph="mf.placePh"></label>
    <label for="mfTime"><span data-i="mf.time"></span><input type="time" id="mfTime" step="300"></label>
    <div class="opts"><button type="button" class="btn sm" data-plus="15" data-i="mf.p15"></button><button type="button" class="btn sm" data-plus="30" data-i="mf.p30"></button><button type="button" class="btn sm" data-plus="60" data-i="mf.p60"></button><button type="button" class="btn sm" data-plus="90" data-i="mf.p90"></button></div>
    <label for="mfNote"><span><span data-i="mf.note"></span> <span class="opt" data-i="mf.optF"></span></span><input type="text" id="mfNote" maxlength="100" data-i-ph="mf.notePh"></label>
    <button class="btn primary" type="submit" data-i="mf.send"></button>
  </form>
</div>

<div class="modal" id="chat" hidden>
  <div class="panel chatpanel">
    <div class="dhead"><div class="t"><b style="font:700 26px/1 var(--display);text-transform:uppercase" data-i="ch.title"></b><span id="chatSub" data-i="ch.sub"></span></div><button class="close" data-close data-i-aria="a.close">×</button></div>
    <div class="chatlist" id="chatList"></div>
    <div class="opts quick" id="chatQuick"></div>
    <form class="chatform" id="chatForm"><input type="text" id="chatText" maxlength="300" data-i-ph="ch.ph" autocomplete="off" enterkeyhint="send"><button class="btn primary" type="submit" data-i="ch.send"></button></form>
  </div>
</div>

<div class="modal" id="group" hidden>
  <div class="panel">
    <div class="dhead"><div class="t"><b style="font:700 26px/1 var(--display);text-transform:uppercase" id="grpTitle"></b><span id="grpSub"></span></div><button class="close" data-close data-i-aria="a.close">×</button></div>
    <div id="grpBody"></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="i18n.js"></script>
<script src="vendor/leaflet.js"></script>
<script src="vendor/maplibre-gl.js"></script>
<script src="vendor/leaflet-maplibre-gl.js"></script>
<script src="vendor/pmtiles.js"></script>
<script src="vendor/basemaps.js"></script>
<script src="vendor/mqtt.min.js"></script>
<script src="vendor/capacitor.js"></script>
<script src="net.js"></script>
<script src="packs.js"></script>
<script src="app.js"></script>
<script src="stats.js"></script>
<script src="social.js"></script>
<script src="crew.js"></script>
<script src="history.js"></script>
</body>
</html>
